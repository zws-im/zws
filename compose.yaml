services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: zws
      POSTGRES_PASSWORD: zws
      POSTGRES_DB: zws
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', "PGPASSWORD=zws psql -h 127.0.0.1 -U zws -d zws -tAc 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7.4-alpine
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
  redis-data:
