name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    name: Build and test

    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: zws
          POSTGRES_PASSWORD: zws
          POSTGRES_DB: zws_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U zws -d zws_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          cache: true
      - name: Cache Next.js
        uses: actions/cache@v6
        with:
          # See here for caching with `yarn` https://github.com/actions/cache/blob/main/examples.md#node---yarn or you can leverage caching with actions/setup-node https://github.com/actions/setup-node
          path: |
            ${{ github.workspace }}/apps/web/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - parallel:
          - name: Build and test
            run: pnpm run check
            env:
              NEXT_PUBLIC_API_URL: https://api.zws.im
              NEXT_PUBLIC_WEBSITE_URL: https://zws.im
              TEST_DATABASE_URL: postgresql://zws:zws@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/zws_test
              TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}
          - name: Check migrations
            run: pnpm run migrate:check
            env:
              DATABASE_URL: postgresql://localhost/drizzle-migration-check
